name: Daily Content Pipeline

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      theme:
        description: 'Content theme'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install edge-tts diffusers transformers accelerate safetensors pillow opencv-python-headless imageio[ffmpeg]
          
      - name: Run pipeline
        env:
          EDGE_TTS_VOICE: es-ES-ElviraNeural
        run: |
          python pipeline/scripts/pipeline.py
          
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Daily content: 2026-08-06"
          git push
          
  deploy:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Astro
        run: |
          cd web && npm install
          
      - name: Build
        run: |
          cd web && npm run build
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
